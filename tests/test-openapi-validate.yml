name: Test rdme openapi validate (valid spec)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # GitHub Actions does not execute `pre` scripts for local actions.
      # We must manually run the pre step (bin/write-gha-pjson.js) so that
      # dist-gha/package.json is written before the main action runs.
      - name: Run pre step (write-gha-pjson)
        run: node bin/write-gha-pjson.js

      - id: action
        uses: .
        with:
          rdme: openapi:validate test/__fixtures__/petstore-simple-weird-version.json

      - name: Assert output contains valid message
        env:
          ACTUAL: ${{ steps.action.outputs.rdme }}
        run: |
          echo "actual: $ACTUAL"
          if echo "$ACTUAL" | grep -qi "valid"; then
            echo "PASS: output contains 'valid'"
          else
            echo "FAIL: expected output to contain 'valid' but got: $ACTUAL"
            exit 1
          fi
