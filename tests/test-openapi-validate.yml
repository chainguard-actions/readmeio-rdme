name: Test openapi validate (valid spec)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # act does not execute `runs.pre` for local (`uses: .`) actions. The
      # action's pre step writes dist-gha/package.json so that oclif resolves
      # commands from dist-gha/commands.js instead of the (unshipped) dist/.
      # Run that same shipped pre script here to emulate the real runner.
      - name: Emulate action pre step (act skips runs.pre for local actions)
        run: |
          node "$GITHUB_WORKSPACE/bin/write-gha-pjson.js"
          if [ ! -f "$GITHUB_WORKSPACE/dist-gha/package.json" ]; then
            echo "FAIL: pre script did not produce dist-gha/package.json"
            exit 1
          fi
      - id: action
        uses: .
        with:
          rdme: openapi validate tests/fixtures/petstore.json
      - name: Assert output reports a valid definition
        env:
          ACTUAL: ${{ steps.action.outputs.rdme }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "is a valid"; then
            echo "FAIL: expected 'is a valid' in output"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -q "petstore.json"; then
            echo "FAIL: expected spec path in output"
            exit 1
          fi
          echo "PASS"
