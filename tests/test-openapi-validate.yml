name: Test openapi validate command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-create dist-gha/package.json for act compatibility
        run: |
          # Find the action directory (handles both workspace-root-is-action-dir and workspace-root-is-repo-root)
          if [ -f "package.json" ] && [ -d "dist-gha" ]; then
            PKG_DIR="."
          elif [ -f "action/package.json" ] && [ -d "action/dist-gha" ]; then
            PKG_DIR="action"
          else
            echo "Cannot find action directory, skipping pre-create step"
            exit 0
          fi
          chmod -R u+w "$PKG_DIR/dist-gha/" 2>/dev/null || true
          node -e "
          const fs = require('fs');
          const path = require('path');
          const pkgDir = process.argv[1];
          const pkg = JSON.parse(fs.readFileSync(path.join(pkgDir, 'package.json'), 'utf-8'));
          pkg.private = true;
          pkg.oclif.commands.target = './commands.js';
          Object.values(pkg.oclif.hooks).forEach(h => { h.target = './commands.js'; });
          delete pkg.oclif.helpClass;
          delete pkg.oclif.plugins;
          fs.writeFileSync(path.join(pkgDir, 'dist-gha/package.json'), JSON.stringify(pkg, null, 2));
          console.log('Created dist-gha/package.json in', pkgDir);
          " "$PKG_DIR"

      - id: action
        uses: .
        env:
          GITHUB_ACTIONS: "true"
          CI: "true"
        with:
          rdme: openapi validate tests/fixtures/openapi/petstore.yaml

      - name: Assert output contains valid message
        env:
          ACTUAL: ${{ steps.action.outputs.rdme }}
        run: |
          echo "actual: $ACTUAL"
          if echo "$ACTUAL" | grep -qi "valid"; then
            echo "PASS: output contains 'valid'"
          else
            echo "FAIL: expected output to contain 'valid', got: $ACTUAL"
            exit 1
          fi
