name: Test rdme openapi validate (valid spec)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dist-gha/package.json (equivalent to pre step write-gha-pjson.js)
        run: |
          # The action's pre step (bin/write-gha-pjson.js) creates dist-gha/package.json
          # but pre steps don't run for local actions. We replicate it here using jq.
          jq '
            .private = true |
            .oclif.commands.target = "./commands.js" |
            .oclif.hooks |= with_entries(.value.target = "./commands.js") |
            del(.oclif.helpClass) |
            del(.oclif.plugins)
          ' package.json > dist-gha/package.json
          echo "Created dist-gha/package.json"
      - id: action
        uses: .
        continue-on-error: true
        with:
          rdme: openapi validate ${{ github.workspace }}/tests/fixtures/petstore.json
      - name: Assert action succeeded on valid spec
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ACTUAL: ${{ steps.action.outputs.rdme }}
        run: |
          echo "outcome: $OUTCOME"
          echo "actual output: $ACTUAL"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed on valid spec, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action succeeded on valid spec"
