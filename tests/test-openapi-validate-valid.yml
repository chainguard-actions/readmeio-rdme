name: Test openapi validate (valid spec)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Write GHA package.json (pre script not run for local actions)
        continue-on-error: true
        run: node action/bin/write-gha-pjson.js

      - id: action
        uses: .
        continue-on-error: true
        with:
          rdme: openapi validate tests/fixtures/petstore.json

      - name: Assert validate output
        env:
          ACTUAL: ${{ steps.action.outputs.rdme }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "actual: $ACTUAL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ACTUAL" ]; then
              echo "FAIL: action succeeded but output is empty"
              exit 1
            fi
            echo "PASS: got validate output"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (acceptable in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
