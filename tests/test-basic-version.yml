name: Test rdme openapi validate (valid spec)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Write dist-gha package.json (pre-script workaround for local actions)
        run: node bin/write-gha-pjson.js
      - id: action
        uses: .
        with:
          rdme: openapi:validate tests/fixtures/petstore.json
      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed with openapi:validate on valid spec, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: rdme openapi:validate ran successfully"
