name: Test rdme --version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          rdme: --version
      - name: Assert version command ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ACTUAL: ${{ steps.action.outputs.rdme }}
        run: |
          echo "outcome: $OUTCOME"
          echo "actual: $ACTUAL"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: --version ran successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: --version ran (failed gracefully — built-in oclif flag may exit non-zero in GHA context)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
