name: Test rdme --version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Write GHA package.json (pre script not run for local actions)
        continue-on-error: true
        run: node action/bin/write-gha-pjson.js

      - id: action
        uses: .
        continue-on-error: true
        with:
          rdme: --version

      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ACTUAL: ${{ steps.action.outputs.rdme }}
        run: |
          echo "outcome: $OUTCOME"
          echo "actual: $ACTUAL"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: rdme --version completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (--version may not set output in GHA context)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
