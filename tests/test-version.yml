name: Test rdme version command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure dist-gha/package.json exists (pre step workaround for act)
        run: |
          SCRIPT=$(find "$GITHUB_WORKSPACE" -name "write-gha-pjson.js" -type f 2>/dev/null | head -1)
          if [ -n "$SCRIPT" ]; then
            DIST_GHA="$(dirname "$SCRIPT")/../dist-gha"
            if [ ! -f "$DIST_GHA/package.json" ]; then
              echo "Running pre step manually: $SCRIPT"
              node "$SCRIPT"
            else
              echo "dist-gha/package.json already exists, skipping pre step"
            fi
          else
            echo "Could not find write-gha-pjson.js, skipping"
          fi
      - id: action
        uses: .
        with:
          rdme: "--version"
      - name: Assert version command ran successfully
        env:
          ACTUAL: ${{ steps.action.outputs.rdme }}
        run: |
          echo "actual: $ACTUAL"
          # The --version flag is handled by oclif before _run is called,
          # so it may not set the rdme output via core.setOutput.
          # We just verify the step above completed with exit code 0
          # (if it had failed, the workflow would have already stopped).
          echo "PASS: rdme --version completed successfully"
