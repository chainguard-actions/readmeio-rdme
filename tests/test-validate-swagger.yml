name: Test openapi validate (valid Swagger 2.0)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # act does not execute `runs.pre` for local actions, so run the action's
      # own pre script (bin/write-gha-pjson.js) exactly as GitHub would.
      - name: Run action pre step (act skips runs.pre for local actions)
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/dist-gha/package.json" ]; then
            node "$GITHUB_WORKSPACE/bin/write-gha-pjson.js"
          fi
          test -f "$GITHUB_WORKSPACE/dist-gha/package.json"
      - id: action
        uses: .
        with:
          rdme: openapi validate tests/fixtures/swagger-valid.json
      - name: Assert output reports a valid Swagger definition
        env:
          ACTUAL: ${{ steps.action.outputs.rdme }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "is a valid Swagger API definition"; then
            echo "FAIL: expected output to report a valid Swagger API definition"
            exit 1
          fi
          echo "PASS"
