name: Test openapi convert (Swagger 2.0 to OpenAPI)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run the action's pre step (act does not run runs.pre for local actions)
        run: |
          node "$GITHUB_WORKSPACE/bin/write-gha-pjson.js"
          test -f "$GITHUB_WORKSPACE/dist-gha/package.json"
      - name: Prepare output directory
        run: |
          rm -rf "$GITHUB_WORKSPACE/convert-out"
          mkdir -p "$GITHUB_WORKSPACE/convert-out"
      - id: action
        uses: .
        with:
          rdme: openapi convert tests/fixtures/petstore-swagger.json --out convert-out/converted.json
      - name: Assert output message
        env:
          ACTUAL: ${{ steps.action.outputs.rdme }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qi "converted"; then
            echo "FAIL: expected conversion success message"
            exit 1
          fi
          echo "PASS"
      - name: Assert converted file is OpenAPI 3
        run: |
          f="$GITHUB_WORKSPACE/convert-out/converted.json"
          if [ ! -f "$f" ]; then
            echo "FAIL: converted file not found at $f"
            exit 1
          fi
          head -c 500 "$f"; echo
          if ! grep -qE '"openapi": *"3\.' "$f"; then
            echo "FAIL: converted file is not OpenAPI 3.x"
            exit 1
          fi
          if grep -q '"swagger"' "$f"; then
            echo "FAIL: converted file still contains swagger key"
            exit 1
          fi
          echo "PASS"
