name: Test openapi convert Swagger to OpenAPI
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # act does not run `runs.pre` for local (uses: .) actions; run the action's
      # own pre script so dist-gha/package.json exists, as it would on GitHub.
      - name: Run action pre step (skipped by act for local actions)
        run: node bin/write-gha-pjson.js
      - name: Ensure output path is clean
        run: rm -f converted-openapi.json
      - id: action
        uses: .
        with:
          rdme: openapi convert tests/fixtures/petstore-swagger.json --out converted-openapi.json
      - name: Assert converted file and output
        env:
          ACTUAL: ${{ steps.action.outputs.rdme }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "converted-openapi.json"; then
            echo "FAIL: output does not mention converted-openapi.json"
            exit 1
          fi
          if [ ! -f converted-openapi.json ]; then
            echo "FAIL: converted-openapi.json not written"
            exit 1
          fi
          head -c 500 converted-openapi.json; echo
          if ! grep -q '"openapi"' converted-openapi.json; then
            echo "FAIL: converted file is not OpenAPI"
            exit 1
          fi
          if grep -q '"swagger"' converted-openapi.json; then
            echo "FAIL: converted file still contains swagger key"
            exit 1
          fi
          echo "PASS"
