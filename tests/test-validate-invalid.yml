name: Test openapi validate (invalid spec fails)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          rdme: openapi validate tests/fixtures/openapi-invalid.json
      - name: Assert the action failed on an invalid definition
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ACTUAL: ${{ steps.action.outputs.rdme }}
        run: |
          echo "outcome: $OUTCOME"
          echo "output: $ACTUAL"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the action to fail for an invalid spec"
            exit 1
          fi
          if echo "$ACTUAL" | grep -q "is a valid"; then
            echo "FAIL: output claims the invalid spec is valid"
            exit 1
          fi
          echo "PASS"
