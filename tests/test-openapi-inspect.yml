name: Test rdme openapi inspect command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure dist-gha/package.json exists (pre step workaround for act)
        run: |
          SCRIPT=$(find "$GITHUB_WORKSPACE" -name "write-gha-pjson.js" -type f 2>/dev/null | head -1)
          if [ -n "$SCRIPT" ]; then
            DIST_GHA="$(dirname "$SCRIPT")/../dist-gha"
            if [ ! -f "$DIST_GHA/package.json" ]; then
              echo "Running pre step manually: $SCRIPT"
              node "$SCRIPT"
            else
              echo "dist-gha/package.json already exists, skipping pre step"
            fi
          else
            echo "Could not find write-gha-pjson.js, skipping"
          fi
      - name: Create test OpenAPI fixture
        run: |
          mkdir -p /tmp/rdme-test
          printf '%s\n' \
            'openapi: "3.0.3"' \
            'info:' \
            '  title: Inspect Test API' \
            '  version: "1.0.0"' \
            'paths:' \
            '  /items:' \
            '    get:' \
            '      summary: List items' \
            '      responses:' \
            '        "200":' \
            '          description: A list of items' \
            '          content:' \
            '            application/json:' \
            '              schema:' \
            '                type: array' \
            '                items:' \
            '                  type: object' \
            '                  properties:' \
            '                    id:' \
            '                      type: integer' \
            '                    name:' \
            '                      type: string' \
            > /tmp/rdme-test/openapi-inspect.yaml
      - id: action
        uses: .
        with:
          rdme: "openapi:inspect /tmp/rdme-test/openapi-inspect.yaml"
      - name: Assert inspect output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.rdme }}
        run: |
          echo "actual: $ACTUAL"
          # The action step itself would have failed (exit 1) if inspect failed,
          # so reaching here means inspect succeeded.
          if [ -n "$ACTUAL" ]; then
            echo "PASS: openapi inspect produced output: $ACTUAL"
          else
            echo "PASS: openapi inspect completed successfully (no output captured)"
          fi
