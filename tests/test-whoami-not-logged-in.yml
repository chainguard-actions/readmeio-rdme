name: Test whoami command when not logged in
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          rdme: whoami
        continue-on-error: true

      - name: Assert action ran or failed gracefully when not logged in
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (not logged in)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (user is logged in)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
