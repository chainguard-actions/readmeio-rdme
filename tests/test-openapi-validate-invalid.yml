name: Test rdme openapi validate (invalid spec path)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # GitHub Actions (and act) do not run `pre` scripts for local actions.
      # We must manually invoke the pre-step script to write dist-gha/package.json.
      - name: Prepare action (write dist-gha/package.json)
        run: node bin/write-gha-pjson.js

      - id: action
        uses: .
        continue-on-error: true
        with:
          rdme: openapi validate tests/fixtures/nonexistent-file.json

      - name: Assert action failed on invalid spec path
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed for non-existent spec file"
          else
            echo "FAIL: expected action to fail for non-existent spec file, got outcome: $OUTCOME"
            exit 1
          fi
