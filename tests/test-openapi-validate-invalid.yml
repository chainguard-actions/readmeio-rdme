name: Test openapi validate (invalid spec)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare dist-gha/package.json
        run: |
          cat > /tmp/prepare-pkg.cjs << 'EOF'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf-8'));
          pkg.private = true;
          pkg.oclif.commands.target = './commands.js';
          Object.values(pkg.oclif.hooks).forEach(hook => { hook.target = './commands.js'; });
          delete pkg.oclif.helpClass;
          delete pkg.oclif.plugins;
          fs.writeFileSync('dist-gha/package.json', JSON.stringify(pkg, null, 2));
          EOF
          node /tmp/prepare-pkg.cjs
      - id: action
        uses: .
        continue-on-error: true
        with:
          rdme: openapi validate tests/fixtures/invalid.json
      - name: Assert action failed on invalid spec
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed on invalid OpenAPI spec"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed on invalid spec but succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
