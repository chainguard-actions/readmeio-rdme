name: Test rdme openapi validate (invalid spec)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # GitHub Actions does not execute `pre` scripts for local actions.
      # We must manually run the pre step (bin/write-gha-pjson.js) so that
      # dist-gha/package.json is written before the main action runs.
      - name: Run pre step (write-gha-pjson)
        run: node bin/write-gha-pjson.js

      - id: action
        uses: .
        continue-on-error: true
        with:
          rdme: openapi:validate test/__fixtures__/invalid-oas.json

      - name: Assert action failed for invalid spec
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed for invalid OpenAPI spec"
          else
            echo "FAIL: expected action to fail for invalid spec but outcome was: $OUTCOME"
            exit 1
          fi
