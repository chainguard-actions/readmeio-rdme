name: Test rdme openapi validate with invalid spec
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare dist-gha/package.json
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const ws = process.env.GITHUB_WORKSPACE || process.cwd();
          const candidates = [path.join(ws, 'action', 'package.json'), path.join(ws, 'package.json')];
          let pkgPath;
          for (const c of candidates) { if (fs.existsSync(c)) { pkgPath = c; break; } }
          if (!pkgPath) { console.error('package.json not found'); process.exit(1); }
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf-8'));
          pkg.private = true;
          pkg.oclif.commands.target = './commands.js';
          Object.values(pkg.oclif.hooks).forEach(h => { h.target = './commands.js'; });
          delete pkg.oclif.helpClass;
          delete pkg.oclif.plugins;
          const outPath = path.join(path.dirname(pkgPath), 'dist-gha', 'package.json');
          if (!fs.existsSync(outPath)) { fs.writeFileSync(outPath, JSON.stringify(pkg, null, 2)); console.log('Wrote ' + outPath); }
          else { console.log('Already exists: ' + outPath); }
          "

      - name: Create invalid OpenAPI spec
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures"
          printf 'openapi: "3.0.3"\ninfo:\n  title: Invalid API\n' > "$GITHUB_WORKSPACE/tests/fixtures/invalid-openapi.yaml"
          echo "Created invalid spec:"
          cat "$GITHUB_WORKSPACE/tests/fixtures/invalid-openapi.yaml"

      - id: action
        name: Run rdme openapi validate on invalid spec
        uses: .
        with:
          rdme: openapi validate ${{ github.workspace }}/tests/fixtures/invalid-openapi.yaml
        continue-on-error: true

      - name: Assert action failed on invalid spec
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed on invalid OpenAPI spec"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected action to fail on invalid spec"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
