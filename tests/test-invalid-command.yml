name: Test rdme openapi validate (nonexistent file)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Write dist-gha package.json (pre-script workaround for local actions)
        run: node bin/write-gha-pjson.js
      - id: action
        uses: .
        with:
          rdme: openapi:validate tests/fixtures/this-file-does-not-exist.json
        continue-on-error: true
      - name: Assert action failed on nonexistent file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected action to fail on nonexistent file, but it succeeded"
            exit 1
          fi
          echo "PASS: action correctly failed on nonexistent file (outcome: $OUTCOME)"
