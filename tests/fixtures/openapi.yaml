openapi: 3.0.0
info:
  title: Test API
  version: 1.0.0
  description: A simple test API for rdme action testing
paths:
  /hello:
    get:
      summary: Say hello
      operationId: sayHello
      responses:
        '200':
          description: A successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Hello, world!
