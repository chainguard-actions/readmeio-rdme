name: Test rdme basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          rdme: "--version"
        continue-on-error: true
      - name: Assert rdme input was accepted
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action ran with the rdme input provided — success or known failure both indicate the input was processed
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action executed with rdme input"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
