name: Test rdme basic usage (version)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          rdme: --version
        continue-on-error: true
      - name: Assert rdme output is present
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OUTPUT: ${{ steps.action.outputs.rdme }}
        run: |
          echo "outcome: $OUTCOME"
          echo "output: $OUTPUT"
          # The action ran (success or failure is acceptable for --version)
          # but the step must have been reached (not skipped)
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action executed with rdme input"
