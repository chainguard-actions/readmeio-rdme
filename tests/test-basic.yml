name: Test rdme basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          rdme: --version
        continue-on-error: true
      - name: Assert rdme input was accepted
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OUTPUT: ${{ steps.action.outputs.rdme }}
        run: |
          echo "outcome: $OUTCOME"
          echo "output: $OUTPUT"
          # The action ran with the rdme input provided; either success or
          # a known failure (e.g. network/auth) is acceptable — what matters
          # is that the input was passed through and the action executed.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: rdme input was accepted and action executed"
