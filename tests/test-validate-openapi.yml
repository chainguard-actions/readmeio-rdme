name: Test openapi validate on a valid OpenAPI definition
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # act does not run `runs.pre` for local (uses: .) actions; run the action's
      # own pre script so dist-gha/package.json exists, as it would on GitHub.
      - name: Run action pre step (skipped by act for local actions)
        run: node bin/write-gha-pjson.js
      - id: action
        uses: .
        with:
          rdme: openapi validate tests/fixtures/petstore-openapi.json
      - name: Assert output reports valid OpenAPI
        env:
          ACTUAL: ${{ steps.action.outputs.rdme }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "is a valid OpenAPI API definition"; then
            echo "FAIL: expected 'is a valid OpenAPI API definition' in output"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -q "petstore-openapi.json"; then
            echo "FAIL: expected spec path in output"
            exit 1
          fi
          echo "PASS"
